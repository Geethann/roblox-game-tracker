# Dependabot: GitHub checks this project's packages and GitHub Actions every
# week and opens a pull request when there's an update - straight away for
# security fixes. Each pull request runs the normal checks, so updates that
# break something can't be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      # One pull request for all small updates, instead of one per package.
      site-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      worker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
