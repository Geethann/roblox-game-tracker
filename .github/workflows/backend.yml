# Backend pipeline.
#   Pull requests:     run the tests and check the Worker builds, so broken code can't be merged.
#   Changes to main:   check, then update the database and deploy to Cloudflare.
# This is what keeps "main" and the live backend identical.
name: Backend

on:
  # Every pull request, whatever it changes: the check is required before
  # merging into main, so it must always run (it takes under a minute).
  pull_request:
  # Deploys only happen when the backend itself changes.
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/backend.yml"]
  workflow_dispatch: # adds a "Run workflow" button on GitHub, for manual re-deploys

# Never run two of these at once for the same branch; a newer run waits its turn.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: worker

jobs:
  check:
    # (The name stays "Check it builds": main's branch protection requires a check with this name.)
    name: Check it builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Run the tests
        run: npm test
      - name: Build without deploying
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the full history, to see what this update changed
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Applying migrations needs the database to answer, so only do it when this
      # update includes one. Otherwise a code-only fix couldn't be deployed while
      # the database is unavailable (e.g. the free plan's daily read limit was hit,
      # which is exactly when a fix most needs to go out). Manual runs always check.
      - name: See whether this update changes the database
        id: db
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ] && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- migrations; then
            echo "No database changes in this update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply new database migrations
        if: steps.db.outputs.changed == 'true'
        run: npx wrangler d1 migrations apply roblox-tracker --remote
      - name: Deploy the Worker
        run: npx wrangler deploy
