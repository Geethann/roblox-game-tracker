# Backend pipeline.
#   Pull requests:     check the Worker builds, so broken code can't be merged.
#   Changes to main:   check, then update the database and deploy to Cloudflare.
# This is what keeps "main" and the live backend identical.
name: Backend

on:
  pull_request:
    paths: ["worker/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/backend.yml"]
  workflow_dispatch: # adds a "Run workflow" button on GitHub, for manual re-deploys

# Never run two of these at once for the same branch; a newer run waits its turn.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: worker

jobs:
  check:
    name: Check it builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Build without deploying
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Apply new database migrations
        run: npx wrangler d1 migrations apply roblox-tracker --remote
      - name: Deploy the Worker
        run: npx wrangler deploy
