# Website pipeline.
#   Pull requests:     check the code, run the tests and build the site, so
#                      broken code can't be merged.
#   Changes to main:   the same checks, then publish it to GitHub Pages.
name: Website

on:
  # Every pull request, whatever it changes: the checks are required before
  # merging into main, so they must always run (they take about a minute).
  pull_request:
  # Publishing only happens when the website itself changes.
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/website.yml"]
  workflow_dispatch:

# Read-only by default; only the publish job gets extra permissions.
permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Check the code (ESLint)
        run: npm run lint
      - name: Run the tests
        run: npm test
      - run: npm run build
        env:
          # Optional: set a repository variable named CF_ANALYTICS_TOKEN to turn on
          # Cloudflare Web Analytics. If it isn't set, no analytics are added.
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      # GitHub Pages only knows about real files, so visiting /game/123
      # directly would show GitHub's own "not found" page. Serving the app
      # as the 404 page lets the app open and show the right page instead.
      - name: Make every page address work on GitHub Pages
        run: cp dist/index.html dist/404.html
      - name: Package the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write     # to publish
      id-token: write  # to prove to GitHub Pages this run is really from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
