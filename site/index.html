<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live player counts, visits and history for any Roblox game. Pick a main game and compare it with others." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Roblox Game Tracker</title>

    <!-- Link previews: what Discord, X, WhatsApp etc. show when someone shares the site.
         These need full web addresses, because the preview is built by another website. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roblox Game Tracker" />
    <meta property="og:title" content="Roblox Game Tracker" />
    <meta property="og:description" content="Live player counts, visits and history for any Roblox game. Pick a main game and compare it with others." />
    <meta property="og:url" content="https://geethann.github.io/roblox-game-tracker/" />
    <meta property="og:image" content="https://geethann.github.io/roblox-game-tracker/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roblox Game Tracker: live stats and history for any Roblox game" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply a saved light/dark choice before anything is drawn,
      // so the page never flashes in the wrong colours.
      try {
        const theme = JSON.parse(localStorage.getItem("theme"));
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
