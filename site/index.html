<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live player counts, visits and history for any Roblox game. Pick a main game and compare it with others." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Roblox Game Tracker</title>
    <script>
      // Apply a saved light/dark choice before anything is drawn,
      // so the page never flashes in the wrong colours.
      try {
        const theme = JSON.parse(localStorage.getItem("theme"));
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
